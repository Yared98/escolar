services:
  # 1. Banco de Dados PostgreSQL Multi-Tenant
  postgres:
    image: postgres:16-alpine
    container_name: escolar_postgres
    restart: always
    environment:
      POSTGRES_USER: escolar_app
      POSTGRES_PASSWORD: escolar_password
      POSTGRES_DB: escolar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escolar_app -d escolar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend REST API em Rust (Axum + SQLx)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: escolar_backend
    restart: always
    environment:
      PORT: 8000
      DATABASE_URL: postgres://escolar_app:escolar_password@postgres:5432/escolar_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Frontend Web Next.js PWA (Offline-First)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: escolar_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # 4. Background Notification & Webhook Worker (Node.js - Zero Cost)
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: escolar_worker
    restart: always
    environment:
      DATABASE_URL: postgres://escolar_app:escolar_password@postgres:5432/escolar_db
      POLL_INTERVAL_MS: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
