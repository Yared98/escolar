[package]
name = "escolar-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono", "migrate", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
ring = "0.17.14"
argon2 = "0.5"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "1.0"
sha2 = "0.10"
reqwest = { version = "0.13.5", features = ["json", "rustls", "form"] }
hmac = "0.12"
hex = "0.4"
subtle = "2.5"
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = { version = "0.2", features = ["builder"] }
aes = "0.8"
cbc = "0.1"
base64 = "0.22"


[dev-dependencies]
tower = "0.5"
