name: agent-gates

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  openspec-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run agent / OpenSpec gates
        run: node scripts/check-agent-gates.mjs
